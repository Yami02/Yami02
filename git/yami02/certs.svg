  </g>
    </g>

    <!-- scanlines -->
    <rect width="640" height="228" fill="url(#sl2)" opacity="0.7"/>

    <!-- outer border -->
    <rect width="639" height="227" x="0.5" y="0.5"
      fill="none" stroke="#1c3a1c" stroke-width="1" rx="6"/>
  </g>
</svg>