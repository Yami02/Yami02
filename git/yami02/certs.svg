    <!-- pct text -->
    <text x="587" y="166"
      font-family="monospace" font-size="10" fill="#3a6a3a"
      text-anchor="start"
    >0%</text>
  </g>
  <!-- ── OSCP ── -->
  <g>
    <!-- label -->
    <text x="20" y="187"
      font-family="monospace" font-size="11" font-weight="bold" fill="#FF00FF"
    >OSCP</text>

    <!-- badge -->
    <rect x="76" y="176" width="62" height="14"
      fill="#1a001a" rx="2"/>
    <text x="79" y="186"
      font-family="monospace" font-size="9" fill="#FF00FF"
